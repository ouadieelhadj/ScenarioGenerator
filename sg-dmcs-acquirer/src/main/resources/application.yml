server:
  port: 8082
  servlet:
    context-path: /

spring:
  application:
    name: sg-dmcs-acquirer
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scenariogenerator}
    username: ${DMCS_ACQUIRER_DB_USER:dmas_acquirer_user}
    password: ${DMCS_ACQUIRER_DB_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    user:
      name: admin
      password: Admin123!

dmcs:
  security:
    user: ${DMCS_BASIC_USER:admin}
    password: ${DMCS_BASIC_PASSWORD:Admin123!}
  legacy:
    enabled: false
  base-dir: ${DMCS_ACQUIRER_BASE_DIR:${user.dir}/runtime/dmcs/acquirer}
  file-id-prefix: MC

mc:
  acquirer:
    defaults:
      DE032_ACQUIRING_BIN: "411111"

logging:
  level:
    com.staging.sg: INFO
  file:
    name: ${DMCS_ACQUIRER_LOG_FILE:${user.dir}/runtime/dmas-dmc/logs/sg-dmcs-acquirer.log}

  liquibase:
    enabled: false
sg:
  persistence:
    module: DMCS_ACQUIRER
