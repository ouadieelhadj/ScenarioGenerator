# ============================================================
#  sg-mc-sms-issuer — Mastercard SMS Issuer (Simulateur MC)
# ============================================================
spring.application.name=sg-mc-sms-issuer

# REST API

# Base de donnees
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/scenariogenerator
spring.datasource.username=mc_sms_issuer_user
spring.datasource.password=mc_iss_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Port ISO jPOS (ecoute des 0200 de l'acquereur)
mc.sms.iss.iso.port=8098

# LMK (HSM)
dmas.lmk.file=F:/ScenarioGenerator/keys/dmas-lmk.lmk

# Logging
logging.level.com.staging.sg=INFO
logging.level.org.jpos=WARN

# JWT (requis par sg-common JwtFilter)
jwt.secret=${JWT_SECRET:ScenarioGeneratorSecretKey2026ScenarioGeneratorSecretKey2026}

# Fichier de log
logging.file.name=F:/ScenarioGenerator/logs/mc-sms-issuer.log

# JWT (requis par sg-common JwtFilter)
jwt.secret=${JWT_SECRET:ScenarioGeneratorSecretKey2026ScenarioGeneratorSecretKey2026}
jwt.expiration-ms=86400000
spring.liquibase.enabled=false

# Reseau : les ports REST viennent de la table networks
sg.network.code=MASTERCARD_SMS
sg.network.role=ISSUER
