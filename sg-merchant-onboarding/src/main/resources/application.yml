server:
  port: ${MERCHANT_ONBOARDING_REST_PORT:8570}

spring:
  application:
    name: sg-merchant-onboarding
  datasource:
    url: ${MERCHANT_ONBOARDING_DB_URL:jdbc:postgresql://localhost:5432/scenariogenerator}
    username: ${MERCHANT_ONBOARDING_DB_USER:onboarding_user}
    password: ${MERCHANT_ONBOARDING_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    enabled: false

merchant-onboarding:
  documents:
    root: ${MERCHANT_ONBOARDING_DOCUMENT_ROOT:${user.dir}/runtime/merchant-onboarding/documents}
  cors:
    allowed-origins: ${MERCHANT_ONBOARDING_CORS_ORIGINS:http://localhost:4210,http://localhost:4220,http://localhost:4230,http://localhost:4240,https://localhost}
  acquiring:
    enabled: ${MERCHANT_ONBOARDING_ACQUIRING_ENABLED:false}
    base-url: ${MERCHANT_ONBOARDING_ACQUIRING_BASE_URL:http://127.0.0.1:8550}
  acquiring-v2:
    enabled: ${MERCHANT_ONBOARDING_ACQUIRING_V2_ENABLED:false}
    base-url: ${MERCHANT_ONBOARDING_ACQUIRING_V2_BASE_URL:http://127.0.0.1:8550}
    oauth2:
      token-url: ${MERCHANT_ONBOARDING_OAUTH2_TOKEN_URL:}
      client-id: ${MERCHANT_ONBOARDING_OAUTH2_CLIENT_ID:}
      client-secret: ${MERCHANT_ONBOARDING_OAUTH2_CLIENT_SECRET:}
      scope: ${MERCHANT_ONBOARDING_OAUTH2_SCOPE:merchant.provision}
  outbox:
    enabled: ${MERCHANT_ONBOARDING_OUTBOX_ENABLED:false}
    batch-size: ${MERCHANT_ONBOARDING_OUTBOX_BATCH_SIZE:20}
    poll-delay-ms: ${MERCHANT_ONBOARDING_OUTBOX_POLL_DELAY_MS:5000}
    worker-id: ${MERCHANT_ONBOARDING_OUTBOX_WORKER_ID:${spring.application.name}}
  identity:
    enabled: ${MERCHANT_ONBOARDING_IDENTITY_ENABLED:false}
    base-url: ${MERCHANT_ONBOARDING_IDENTITY_BASE_URL:http://127.0.0.1:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  file:
    name: ${MERCHANT_ONBOARDING_LOG_FILE:${user.dir}/runtime/merchant-onboarding/logs/merchant-onboarding.log}
