
spring:
  liquibase:
    enabled: false
  application:
    name: sg-swam-issuer
  datasource:
    url: jdbc:postgresql://localhost:5432/scenariogenerator
    username: swam_issuer_user
    password: postgres123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# REST, port ISO, DE33 et fichier de log sont lus depuis swam_interface.

jwt:
  secret: ${JWT_SECRET:ScenarioGeneratorSecretKey2026ScenarioGeneratorSecretKey2026}
  expiration-ms: 86400000

# MAC DE128 (parametrable, meme mecanique que DMAS)
swam:
  authorization:
    owner: ${SWAM_AUTHORIZATION_OWNER:LOCAL_ISSUING}
  mac:
    fields: "4,11,37,41,42"
    representation: "ascii"
    reject-code: "916"
    enforce: true

dmas:
  lmk:
    file: ${DMAS_LMK_FILE:D:/MoneyCore/ScenarioGenerator/keys/dmas-lmk.lmk}

logging:
  level:
    org.jpos: DEBUG
    com.staging.sg: DEBUG

sg:
  persistence:
    module: SWAM_ISSUER
  network:
    code: SWAM
    role: ISSUER
