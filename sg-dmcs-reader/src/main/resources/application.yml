server:
  port: 8300
  servlet:
    context-path: /

spring:
  application:
    name: sg-dmcs-reader
  datasource:
    url: jdbc:postgresql://localhost:5432/scenariogenerator
    username: scenario_user
    password: postgres123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    user:
      name: admin
      password: Admin123!

dmcs:
  base-dir: D:/MoneyCore/ScenarioGenerator/dmcs

logging:
  level:
    com.staging.sg: INFO
  file:
    name: D:/MoneyCore/ScenarioGenerator/logs/dmcs-reader.log

  liquibase:
    enabled: false
