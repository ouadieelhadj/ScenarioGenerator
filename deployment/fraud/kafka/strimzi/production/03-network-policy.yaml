apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fraud-kafka-ingress
  namespace: fraud-streaming
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: fraud-kafka
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              fraud-kafka-access: allowed
      ports:
        - {protocol: TCP, port: 9092}
        - {protocol: TCP, port: 9093}
