server:
  port: ${ACQUIRING_REST_PORT:8550}

spring:
  application:
    name: sg-acquiring
  datasource:
    url: ${ACQUIRING_DB_URL:jdbc:postgresql://localhost:5432/scenariogenerator}
    username: ${ACQUIRING_DB_USER:acquiring_user}
    password: ${ACQUIRING_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    enabled: false

acquiring:
  security:
    oauth2:
      issuer-uri: ${ACQUIRING_OAUTH2_ISSUER_URI:http://127.0.0.1:8090/realms/futurpayment}
      jwk-set-uri: ${ACQUIRING_OAUTH2_JWK_SET_URI:http://127.0.0.1:8090/realms/futurpayment/protocol/openid-connect/certs}
      audience: ${ACQUIRING_OAUTH2_AUDIENCE:futurpayment-acquiring}
  way4:
    enabled: ${ACQUIRING_WAY4_ENABLED:false}
    dispatch-enabled: ${ACQUIRING_WAY4_DISPATCH_ENABLED:false}
    base-url: ${ACQUIRING_WAY4_BASE_URL:http://127.0.0.1:8580}
    batch-size: ${ACQUIRING_WAY4_BATCH_SIZE:10}
    poll-delay-ms: ${ACQUIRING_WAY4_POLL_DELAY_MS:5000}
    worker-id: ${ACQUIRING_WAY4_WORKER_ID:${HOSTNAME:way4-dispatcher}}
    oauth2:
      token-url: ${ACQUIRING_WAY4_OAUTH2_TOKEN_URL:}
      client-id: ${ACQUIRING_WAY4_OAUTH2_CLIENT_ID:}
      client-secret: ${ACQUIRING_WAY4_OAUTH2_CLIENT_SECRET:}
      scope: ${ACQUIRING_WAY4_OAUTH2_SCOPE:way4.generate}
  three-ds:
    enabled: ${ACQUIRING_THREE_DS_ENABLED:false}
    base-url: ${ACQUIRING_THREE_DS_BASE_URL:http://127.0.0.1:8560}
  issuing:
    enabled: ${ACQUIRING_ISSUING_ENABLED:false}
    base-url: ${ACQUIRING_ISSUING_BASE_URL:http://127.0.0.1:8540/api/issuing/v1}
    issuer-id: ${ACQUIRING_ISSUING_ISSUER_ID:}
  server-pos:
    enabled: ${ACQUIRING_SERVER_POS_ENABLED:false}
    base-url: ${ACQUIRING_SERVER_POS_BASE_URL:http://127.0.0.1:8530}
    connect-timeout-ms: ${ACQUIRING_SERVER_POS_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${ACQUIRING_SERVER_POS_READ_TIMEOUT_MS:3000}
  network:
    connect-timeout-ms: ${ACQUIRING_NETWORK_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${ACQUIRING_NETWORK_READ_TIMEOUT_MS:15000}
    card-gateway:
      enabled: ${ACQUIRING_CARD_GATEWAY_ENABLED:false}
      base-url: ${ACQUIRING_CARD_GATEWAY_BASE_URL:http://127.0.0.1:8563}
    swam:
      enabled: ${ACQUIRING_SWAM_ENABLED:false}
      base-url: ${ACQUIRING_SWAM_BASE_URL:http://127.0.0.1:8094}

logging:
  file:
    name: ${ACQUIRING_LOG_FILE:${user.dir}/runtime/acquiring/logs/acquiring.log}
