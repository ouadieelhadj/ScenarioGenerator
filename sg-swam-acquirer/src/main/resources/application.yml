
spring:
  liquibase:
    enabled: false
  application:
    name: sg-swam-acquirer
  datasource:
    url: jdbc:postgresql://localhost:5432/scenariogenerator
    username: swam_acquirer_user
    password: postgres123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# REST, cible ISO, DE32/DE33 et fichier de log sont lus depuis swam_interface.

jwt:
  secret: ${JWT_SECRET:ScenarioGeneratorSecretKey2026ScenarioGeneratorSecretKey2026}
  expiration-ms: 86400000

# MAC DE128 (parametrable, meme mecanique que DMAS)
swam:
  mac:
    fields: "4,11,37,41,42"
    representation: "ascii"
    reject-code: "916"
    enforce: true

dmas:
  lmk:
    file: F:/ScenarioGenerator/keys/dmas-lmk.lmk


sg:
  network:
    code: SWAM
    role: ACQUIRER
