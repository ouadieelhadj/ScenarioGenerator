server:
  port: ${FRAUD_GATEWAY_PORT:8571}
spring:
  application:
    name: sg-fraud-bank-gateway
  datasource:
    url: ${FRAUD_GATEWAY_DB_URL:jdbc:postgresql://127.0.0.1:5432/fraud_gateway}
    username: ${FRAUD_GATEWAY_DB_USER:fraud_gateway_user}
    password: ${FRAUD_GATEWAY_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
fraud-gateway:
  platform-base-url: ${FRAUD_PLATFORM_BASE_URL:http://127.0.0.1:8570}
  routing:
    dynamic-listeners-enabled: ${FRAUD_GATEWAY_DYNAMIC_LISTENERS_ENABLED:false}
    enforce-dedicated-rest-ports: ${FRAUD_GATEWAY_ENFORCE_DEDICATED_REST_PORTS:false}
  lab:
    enabled: ${FRAUD_LAB_SCENARIOS_ENABLED:false}
    multibank-bootstrap-enabled: ${FRAUD_LAB_MULTIBANK_BOOTSTRAP_ENABLED:false}
  security:
    issuer-uri: ${FRAUD_GATEWAY_OAUTH2_ISSUER_URI:http://127.0.0.1:8090/realms/futurpayment}
    jwk-set-uri: ${FRAUD_GATEWAY_OAUTH2_JWK_SET_URI:http://127.0.0.1:8090/realms/futurpayment/protocol/openid-connect/certs}
    audience: ${FRAUD_GATEWAY_OAUTH2_AUDIENCE:futurpayment-fraud}
  iso:
    permanent-enabled: ${FRAUD_ISO_PERMANENT_ENABLED:false}
    listen-port: ${FRAUD_ISO_LISTEN_PORT:8572}
    client-enabled: ${FRAUD_ISO_CLIENT_ENABLED:false}
    remote-host: ${FRAUD_ISO_REMOTE_HOST:127.0.0.1}
    remote-port: ${FRAUD_ISO_REMOTE_PORT:8572}
    echo-interval-seconds: ${FRAUD_ISO_ECHO_INTERVAL_SECONDS:30}
    reconnect-backoff-seconds: ${FRAUD_ISO_RECONNECT_BACKOFF_SECONDS:5}
    request-tak-on-sign-on: ${FRAUD_ISO_REQUEST_TAK_ON_SIGN_ON:true}
    member-id: ${FRAUD_ISO_MEMBER_ID:}
    platform-service-token: ${FRAUD_ISO_PLATFORM_SERVICE_TOKEN:}
    sign-on-code: ${FRAUD_ISO_SIGN_ON_CODE:001}
    echo-code: ${FRAUD_ISO_ECHO_CODE:301}
    key-request-code: ${FRAUD_ISO_KEY_REQUEST_CODE:101}
    key-delivery-code: ${FRAUD_ISO_KEY_DELIVERY_CODE:161}
    key-ack-code: ${FRAUD_ISO_KEY_ACK_CODE:162}
    zmk-reference: ${FRAUD_ISO_ZMK_REFERENCE:}
    key-envelope-field: ${FRAUD_ISO_KEY_ENVELOPE_FIELD:96}
    key-kcv-field: ${FRAUD_ISO_KEY_KCV_FIELD:48}
    token-field: ${FRAUD_ISO_TOKEN_FIELD:62}
    score-response-field: ${FRAUD_ISO_SCORE_RESPONSE_FIELD:63}
    sca-marker-field: ${FRAUD_ISO_SCA_MARKER_FIELD:48}
    rc-allow: ${FRAUD_ISO_RC_ALLOW:00}
    rc-alert: ${FRAUD_ISO_RC_ALERT:00}
    rc-challenge: ${FRAUD_ISO_RC_CHALLENGE:00}
    rc-hold: ${FRAUD_ISO_RC_HOLD:00}
    rc-block: ${FRAUD_ISO_RC_BLOCK:00}
