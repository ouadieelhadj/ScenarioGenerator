spring:
  datasource:
    url: jdbc:h2:mem:fraud_gateway;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
fraud-gateway:
  platform-base-url: http://127.0.0.1:8570
  security:
    issuer-uri: http://127.0.0.1:8090/realms/futurpayment
    jwk-set-uri: http://127.0.0.1:8090/realms/futurpayment/protocol/openid-connect/certs
    audience: futurpayment-fraud
  lab:
    multibank-bootstrap-enabled: false
