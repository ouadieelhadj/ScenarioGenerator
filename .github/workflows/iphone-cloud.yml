name: DAMANCASH - Validation iPhone sur Mac heberge
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branche du client mobile à compiler dans ce dépôt
        type: string
        required: true
        default: codex/damancash-iphone-20261122
      authenticated:
        description: Executer les parcours authentifies avec le secret de recette
        type: boolean
        default: false
      device_sdk_only:
        description: Compiler uniquement pour le SDK iPhone, sans signature ni installation
        type: boolean
        default: false
      transport_only:
        description: Diagnostic HTTPS Apple sans compte, compilation application ou changement serveur
        type: boolean
        default: false
      transport_simulator:
        description: Exécuter la sonde anonyme dans iOS Simulator plutôt que macOS
        type: boolean
        default: false
      ui_focus:
        description: Lot natif complet ou complément session, Fichiers et réinstallation
        type: choice
        default: full
        options:
          - full
          - session_files_reinstall
          - authenticated
          - connection
          - incident_completion
permissions:
  contents: read
concurrency:
  group: iphone-damancash-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ios-validation:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      FP_IOS_OUTPUT: ${{ github.workspace }}/preuves-mac
      NG_BUILD_MAX_WORKERS: '2'
    defaults:
      run:
        shell: bash
        working-directory: sg-frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ !inputs.transport_only }}
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            sg-frontend/package-lock.json
            sg-frontend/tools/ios/build-iphone.sh
      - name: Identifier les sources réellement compilées
        run: |
          mkdir -p "$FP_IOS_OUTPUT"
          git rev-parse HEAD > "$FP_IOS_OUTPUT/source-commit.txt"
      - name: Diagnostiquer HTTPS Apple sans compte
        if: ${{ inputs.transport_only }}
        env:
          FP_TRANSPORT_SIMULATOR: ${{ inputs.transport_simulator }}
        run: |
          if [[ "$FP_TRANSPORT_SIMULATOR" == true ]]; then
            python3 tools/ios/prepare-simulator.py
            python3 tools/ios/probe-native-https.py --simulator
          else
            python3 tools/ios/probe-native-https.py
          fi
      - name: Verifier les outils et compiler les sources XCTest avant le client
        if: ${{ !inputs.transport_only }}
        run: python3 tools/ios/probe-simulator-signature.py
      - name: Observer la connectivite API sans compte reel
        if: ${{ !inputs.device_sdk_only && !inputs.transport_only }}
        run: python3 tools/ios/probe-native-gateway.py
      - name: Amorcer le simulateur iPhone
        if: ${{ !inputs.device_sdk_only && !inputs.transport_only }}
        run: python3 tools/ios/prepare-simulator.py
      - name: Compiler le client et tester les politiques Swift
        if: ${{ !inputs.transport_only }}
        env:
          FP_IOS_DEVICE_SDK_ONLY: ${{ inputs.device_sdk_only }}
        run: |
          if [[ "$FP_IOS_DEVICE_SDK_ONLY" == true ]]; then
            bash tools/ios/build-iphone.sh prepare
            python3 tools/ios/build-device-sdk.py
          else
            bash tools/ios/build-iphone.sh simulator
          fi
      - name: Executer les vrais parcours XCUITest
        if: ${{ !inputs.device_sdk_only && !inputs.transport_only }}
        env:
          FP_IOS_AUTHENTICATED_TESTS: ${{ inputs.authenticated }}
          FP_IOS_UI_FOCUS: ${{ inputs.ui_focus }}
          FP_IOS_TEST_USER: bim.amina
          FP_IOS_TEST_PASSWORD: ${{ secrets.FP_IOS_TEST_PASSWORD }}
        run: python3 tools/ios/run-ios-ui-tests.py
      - name: Proteger les preuves avant transfert
        if: always()
        run: python3 tools/ios/protect-cloud-evidence.py
      - name: Conserver seulement les preuves expurgees
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iphone-resultats-${{ github.run_number }}
          path: |
            preuves-mac/diagnostic-https-apple-simulateur.json
            preuves-mac/diagnostic-https-apple.json
            preuves-mac/preparation.json
            preuves-mac/simulator-tool-preflight.json
            preuves-mac/swift-policy-tests.log
            preuves-mac/preuves-iphone-chiffrees.cms
            preuves-mac/preuves-chiffrees-manifeste.json
            preuves-mac/connectivite-api.json
            preuves-mac/device-sdk-check.json
            preuves-mac/source-commit.txt
            preuves-mac/preuves-publiables/resultats-ui.json
          if-no-files-found: warn
          retention-days: 7
