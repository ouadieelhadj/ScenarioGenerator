server:
  port: 8083
  servlet:
    context-path: /
spring:
  application:
    name: sg-dmcs-issuer
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scenariogenerator}
    username: ${DMCS_ISSUER_DB_USER:dmas_issuer_user}
    password: ${DMCS_ISSUER_DB_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    user:
      name: admin
      password: Admin123!
  liquibase:
    enabled: false
dmcs:
  security:
    user: ${DMCS_BASIC_USER:admin}
    password: ${DMCS_BASIC_PASSWORD:Admin123!}
  legacy:
    enabled: false
  base-dir: ${DMCS_ISSUER_BASE_DIR:${user.dir}/runtime/dmcs/issuer}
  file-id-prefix: MC
mc:
  issuer:
    defaults:
      DE093_DEST_ID: "411111"
      DE094_ORIGIN_ID: "555555"
logging:
  level:
    com.staging.sg: INFO
  file:
    name: ${DMCS_ISSUER_LOG_FILE:${user.dir}/runtime/dmas-dmc/logs/sg-dmcs-issuer.log}
sg:
  persistence:
    module: DMCS_ISSUER
