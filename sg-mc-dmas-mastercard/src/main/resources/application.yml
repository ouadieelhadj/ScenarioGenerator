spring:
  application:
    name: sg-mc-dmas-mastercard
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scenariogenerator}
    username: ${MC_DMAS_MASTERCARD_DB_USER:mc_dmas_mastercard}
    password: ${MC_DMAS_MASTERCARD_DB_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    enabled: false


dmas:
  pek:
    auto-renewal: false
    renewal-interval-ms: 86400000
    renewal-initial-delay-ms: 86400000
  jpos:
    echo-interval-ms: 5000
  member-group-id: TESTGRP01
  lmk:
    file: ${DMAS_MASTERCARD_LMK_FILE:${user.dir}/keys/dmas-lmk-iss.lmk}
    rebuild: false
  mac:
    fields: "4,11,37,41,42"
    representation: ebcdic

jwt:
  secret: ${JWT_SECRET:ScenarioGeneratorSecretKey2026ScenarioGeneratorSecretKey2026}
  expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  file:
    name: ${DMAS_MASTERCARD_LOG_FILE:${user.dir}/runtime/dmas-dmc/logs/sg-mc-dmas-mastercard.log}

sg:
  persistence:
    module: MC_DMAS_MASTERCARD
  network:
    code: DMAS
    role: ISSUER
