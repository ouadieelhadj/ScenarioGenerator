// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    // Pin the same installed toolchain for the app and both Capacitor libraries.
    // Do not let a library silently select another (missing) Build Tools release.
    plugins.withId('com.android.application') { android.buildToolsVersion = rootProject.ext.buildToolsVersion }
    plugins.withId('com.android.library') { android.buildToolsVersion = rootProject.ext.buildToolsVersion }
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
