spring:
  application:
    name: sg-mc-dmas-member
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scenariogenerator}
    username: ${MC_DMAS_MEMBER_DB_USER:mc_dmas_member}
    password: ${MC_DMAS_MEMBER_DB_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    enabled: false


dmas:
  member-group-id: TESTGRP01
  loadtest:
    max-concurrent-tests: 1
  issuer-host: localhost
  lmk:
    file: ${DMAS_MEMBER_LMK_FILE:${user.dir}/keys/dmas-lmk-acq.lmk}
    rebuild: false
  mac:
    fields: "4,11,37,41,42"
    representation: ebcdic
  session:
    auto-start: false
    startup-delay-ms: 3000

jwt:
  secret: ${JWT_SECRET:ScenarioGeneratorSecretKey2026ScenarioGeneratorSecretKey2026}
  expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  file:
    name: ${DMAS_MEMBER_LOG_FILE:${user.dir}/runtime/dmas-dmc/logs/sg-mc-dmas-member.log}

sg:
  persistence:
    module: MC_DMAS_MEMBER
  network:
    code: DMAS
    role: ACQUIRER
