spring:
  application:
    name: sg-acquirer
  datasource:
    url: jdbc:postgresql://localhost:5432/scenariogenerator
    username: scenario_user
    password: postgres123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    enabled: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:ScenarioGeneratorSecretKey2026ScenarioGeneratorSecretKey2026}
  expiration-ms: 86400000

mc:
  acquirer:
    mas:
      host: ${MAS_HOST:127.0.0.1}
      port: ${MAS_PORT:8200}
      timeout-seconds: 30
    test-bin: "555555"
    pan-length: 16
    defaults:
      DE003_PROCESSING_CODE: "000000"
      DE018_MCC: "5999"
      DE022_POS_ENTRY_MODE: "051"
      DE025_POS_CONDITION_CODE: "00"
      DE032_ACQUIRING_BIN: "411111"
      DE033_FORWARDING_BIN: "555555"
      DE041_TERMINAL_ID: "MCTERM01"
      DE042_MERCHANT_ID: "MCMERCHANT0001 "
      DE043_MERCHANT_NAME: "DEFAULT MERCHANT PARIS FR"
      DE049_CURRENCY_CODE: "978"
      DE052_PIN: "1234"
      DE052_PIN_BLOCK_FORMAT: "iso0"

  kek: ${KEK:0123456789ABCDEF0123456789ABCDEF}

  network:
    auto-signon: false  # generateur : pas de connexion DMAS au boot (remettre true en Phase 2)
    echo-interval-seconds: 60

  hsm:
    simulated: true

  security:
    mac-enabled: true
    mac-fields: "2,3,4,7,11,12,13,18,22,37,41,42,49,64"
    mac-field: 64
    pin-enabled: true

reports:
  base-dir: ${REPORTS_DIR:D:/MoneyCore/ScenarioGenerator/reports}

tps:
  default: 10
  max: 100
  thread-pool-size: 20

app:
  admin:
    login: admin
    password: Admin123!
    email: admin@staging.com
  cors:
    allowed-origins: http://localhost:4200

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  file:
    name: D:/MoneyCore/ScenarioGenerator/logs/acquiring.log
