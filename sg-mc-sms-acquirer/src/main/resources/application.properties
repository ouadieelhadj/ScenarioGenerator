# ============================================================
#  sg-mc-sms-acquirer — Mastercard SMS Acquirer (Membre)
# ============================================================
spring.application.name=sg-mc-sms-acquirer

# REST API
server.port=8095

# Base de donnees
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/scenariogenerator
spring.datasource.username=mc_sms_acquirer_user
spring.datasource.password=mc_acq_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Port ISO jPOS (ecoute des messages entrants)
mc.sms.acq.iso.port=8096

# Connexion au MIP Mastercard (ou simulateur issuer en test local)
mc.sms.host=localhost
mc.sms.port=8098
mc.sms.forwarding-id=000000000001
mc.sms.connect-timeout=10000
mc.sms.read-timeout=30000

# LMK (HSM)
dmas.lmk.file=F:/ScenarioGenerator/keys/dmas-lmk.lmk

# Logging
logging.level.com.staging.sg=INFO
logging.level.org.jpos=WARN
