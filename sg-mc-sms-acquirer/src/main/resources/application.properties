# ============================================================
#  sg-mc-sms-acquirer — Mastercard SMS Acquirer (Membre)
# ============================================================
spring.application.name=sg-mc-sms-acquirer

# REST API

# Base de donnees
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/scenariogenerator
spring.datasource.username=mc_sms_acquirer_user
spring.datasource.password=mc_acq_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Port ISO jPOS (ecoute des messages entrants)
mc.sms.acq.iso.port=8096

# Connexion au MIP Mastercard (ou simulateur issuer en test local)
mc.sms.host=localhost
mc.sms.port=8098
mc.sms.forwarding-id=9000000001
mc.sms.connect-timeout=10000
mc.sms.read-timeout=30000

# LMK (HSM)
dmas.lmk.file=F:/ScenarioGenerator/keys/dmas-lmk.lmk

# Logging
logging.level.com.staging.sg=INFO
logging.level.org.jpos=WARN

# JWT (requis par sg-common JwtFilter)
jwt.secret=${JWT_SECRET:ScenarioGeneratorSecretKey2026ScenarioGeneratorSecretKey2026}

# Fichier de log
logging.file.name=F:/ScenarioGenerator/logs/mc-sms-acquirer.log

# JWT (requis par sg-common JwtFilter)
jwt.secret=${JWT_SECRET:ScenarioGeneratorSecretKey2026ScenarioGeneratorSecretKey2026}
jwt.expiration-ms=86400000
spring.liquibase.enabled=false

# Reseau : les ports REST viennent de la table networks
sg.network.code=MASTERCARD_SMS
sg.network.role=ACQUIRER

# Echange de cles
mc.sms.member-group-id=MCTESTGRP
